AWSTemplateFormatVersion: '2010-09-09'
Description: API Gateway HTTP API and Lambda for the judge application

Parameters:
  ProjectName:
    Type: String
    Default: judge
    AllowedPattern: '^[a-z][a-z0-9-]{0,30}$'
    ConstraintDescription: Must start with a lowercase letter and contain only lowercase letters, digits, and hyphens.
  Environment:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z][a-z0-9-]{0,15}$'
    ConstraintDescription: Must start with a lowercase letter and contain only lowercase letters, digits, and hyphens.
  LambdaMemorySize:
    Type: Number
    Default: 256
    MinValue: 128
    MaxValue: 10240
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1096
      - 1827
      - 2192
      - 2557
      - 2922
      - 3288
      - 3653
  ThrottlingBurstLimit:
    Type: Number
    Default: 20
    MinValue: 1
  ThrottlingRateLimit:
    Type: Number
    Default: 10
    MinValue: 1

Resources:
  ApiLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-api'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Project
          Value: !Ref ProjectName

  ApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cloudwatch-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ApiLambdaLogGroup.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Project
          Value: !Ref ProjectName

  ApiLambda:
    Type: AWS::Lambda::Function
    DependsOn: ApiLambdaLogGroup
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W3002
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-api'
      Description: !Sub 'HTTP API for ${ProjectName}'
      Architectures:
        - arm64
      Code: ../api/.build/api.zip
      Handler: bootstrap
      MemorySize: !Ref LambdaMemorySize
      PackageType: Zip
      Role: !GetAtt ApiLambdaRole.Arn
      Runtime: provided.al2023
      Timeout: 10
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Project
          Value: !Ref ProjectName

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-api'
      ProtocolType: HTTP
      Tags:
        Environment: !Ref Environment
        ManagedBy: CloudFormation
        Project: !Ref ProjectName

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationMethod: POST
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiLambda.Arn}/invocations'
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 10000

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      AuthorizationType: NONE
      RouteKey: '$default'
      Target: !Sub 'integrations/${ApiIntegration}'

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${ProjectName}-${Environment}-api'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Project
          Value: !Ref ProjectName

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      AccessLogSettings:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: >-
          {"httpMethod":"$context.httpMethod","integrationError":"$context.integrationErrorMessage","ip":"$context.identity.sourceIp","protocol":"$context.protocol","requestId":"$context.requestId","requestTime":"$context.requestTime","responseLength":"$context.responseLength","routeKey":"$context.routeKey","status":"$context.status"}
      ApiId: !Ref HttpApi
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref ThrottlingBurstLimit
        ThrottlingRateLimit: !Ref ThrottlingRateLimit
      StageName: '$default'
      Tags:
        Environment: !Ref Environment
        ManagedBy: CloudFormation
        Project: !Ref ProjectName

  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

Outputs:
  ApiEndpoint:
    Description: Base URL of the HTTP API.
    Value: !GetAtt HttpApi.ApiEndpoint
  HealthUrl:
    Description: Health-check endpoint.
    Value: !Sub '${HttpApi.ApiEndpoint}/health'
  ApiLambdaFunctionName:
    Description: Name of the API Lambda function.
    Value: !Ref ApiLambda
