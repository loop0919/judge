AWSTemplateFormatVersion: '2010-09-09'
Description: Deployment artifact storage for the judge application

Parameters:
  ProjectName:
    Type: String
    Default: judge
    AllowedPattern: '^[a-z][a-z0-9-]{0,30}$'
    ConstraintDescription: Must start with a lowercase letter and contain only lowercase letters, digits, and hyphens.
  Environment:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z][a-z0-9-]{0,15}$'
    ConstraintDescription: Must start with a lowercase letter and contain only lowercase letters, digits, and hyphens.

Resources:
  DeploymentArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: DeleteOldObjectVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Project
          Value: !Ref ProjectName
      VersioningConfiguration:
        Status: Enabled

  DeploymentArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref DeploymentArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DeploymentArtifactBucket.Arn
              - !Sub '${DeploymentArtifactBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  ArtifactBucketName:
    Description: S3 bucket used by aws cloudformation package.
    Value: !Ref DeploymentArtifactBucket
  ArtifactBucketArn:
    Description: ARN of the deployment artifact bucket.
    Value: !GetAtt DeploymentArtifactBucket.Arn
